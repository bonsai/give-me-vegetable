name: research-loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read SEED
        run: cat research/seed.yaml

      - name: Discover research seeds
        env:
          SEARCH_ENDPOINT: ${{ secrets.RESEARCH_SEARCH_ENDPOINT }}
        run: python research/research.py

      - name: Record run state
        run: |
          mkdir -p research/runs
          cp research/runs/latest.json research/runs/$(date +%F).json
          echo "events=$(wc -l < data/events.jsonl)"

      - name: Commit research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/runs
          git diff --cached --quiet || git commit -m 'Run SEED research loop'
          git push
