name: research-loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read SEED
        run: |
          echo '=== research/seed.yaml ==='
          cat research/seed.yaml

      - name: Research loop contract
        run: |
          mkdir -p research/runs
          cat > research/runs/README.md <<'EOF'
          # Research Loop

          SEED → discover → expand → verify → normalize → dedupe → append → recurse

          This workflow is the AW entry point. The research agent should use
          `research/seed.yaml` as its only starting state and write verified
          candidates to `data/events.jsonl`.

          Rules:
          - never invent event facts
          - preserve source URLs
          - exclude future events without evidence
          - deduplicate by date + place
          - use newly discovered places/implementers as the next seeds
          EOF

      - name: Show current database size
        run: |
          echo "events=$(wc -l < data/events.jsonl)"

      - name: Commit research state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/runs/README.md
          git diff --cached --quiet || git commit -m 'Record research loop state'
          git push
